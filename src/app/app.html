<h1>Counter App</h1>

<div class="counter-display">
  <span class="counter-value">{{ count() }}</span>
</div>

<div class="counter-controls">
  <app-counter-button
    label="-"
    variant="danger"
    (buttonClick)="onDecrement()"
  />

  <app-counter-button
    label="+"
    variant="success"
    (buttonClick)="onIncrement()"
  />
</div>

<router-outlet />
