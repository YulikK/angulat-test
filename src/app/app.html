<h1>Counter App</h1>

<div class="counter-display">
  <span class="counter-value">{{ count() }}</span>
</div>

<div class="counter-controls">
  @for (button of buttons(); track button.label) {
    <app-counter-button
      [label]="button.label"
      [variant]="button.variant"
      (buttonClick)="button.action()"
    />
  }
</div>

<router-outlet />
