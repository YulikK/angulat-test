<mat-toolbar class="app-header">
  <mat-icon class="header-icon">stars</mat-icon>
  <span class="header-title">{{ title }}</span>
</mat-toolbar>

<div
  class="characters-container"
  cdkDropList
  cdkDropListLockAxis="y"
  cdkDropListSortingDisabled="true"
>
  <div
    #dropSeparator
    class="drop-separator"
    [class.drop-target-active]="dropTargetIndex() === 0"
    [class.visible]="isDragging()"
  ></div>

  @for (character of characters(); track character.id; let i = $index) {
    <div
      cdkDrag
      class="drag-container"
      (cdkDragStarted)="onDragStarted(i)"
      (cdkDragEnded)="onDragEnded()"
      (cdkDragMoved)="onDragMoved($event)"
      (cdkDragReleased)="onDragReleased()"
    >
      <div class="character-wrapper">
        <app-character-card [character]="character" />
        <button
          mat-icon-button
          class="drag-button"
          matTooltip="Drag to reorder"
          cdkDragHandle
        >
          <mat-icon>drag_indicator</mat-icon>
        </button>
      </div>
    </div>

    <div
      #dropSeparator
      class="drop-separator"
      [class.drop-target-active]="dropTargetIndex() === i + 1"
      [class.visible]="isDragging()"
    ></div>
  }
</div>
